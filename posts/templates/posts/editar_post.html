{% extends 'posts/base.html' %}
{% block title %} Editar Post {% endblock %}
{% block content %}

<div class="editar-container">

    <h1>Editar post</h1>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="campo">
            <label>Título:</label>
            <input type="text" name="titulo"
                   value="{{ post.titulo }}" required>
        </div>

        <div class="campo">
            <label>Descripción:</label>
            <textarea name="descripcion" required>{{ post.descripcion }}</textarea>
        </div>

        <div class="campo">
            <label>Autor:</label>
            <input type="text" value="{{ post.autor }}" disabled>
        </div>

        <div class="campo">
            <label>Imagen actual:</label>

            {% if post.url_imagen %}
                <img src="{{ post.url_imagen.url }}"
                     alt="Imagen del post"
                     class="imagen-actual">
            {% else %}
                <p>Este post no tiene imagen.</p>
            {% endif %}
        </div>

        <div class="campo">
            <label>Cambiar imagen:</label>
            <input type="file" name="url_imagen" accept="image/*">
            <small>Si no seleccionas otra imagen, se conservará la actual.</small>
        </div>

        <button type="submit" class="btn-guardar">
            Guardar cambios
        </button>

    </form>

</div>

{% endblock %}
