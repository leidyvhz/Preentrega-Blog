{% extends 'posts/base.html' %}
{% block title %} Editar Post {% endblock %}
{% block content %}

<div class="contacto-container">
    <h1>EDITAR POST</h1>
    
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        <p>
            <label>Título:</label>
            <input type="text" name="titulo" value="{{post.titulo}}" required>
        </p>

        <p>
            <label>Contenido:</label>
            <textarea name="contenido" required>{{post.contenido}}</textarea>
        </p>

        <p>
            <label>Imagen:</label>
            <input type="file" name="imagen" accept="image/*">
        </p>

        <p>
            <label>Estado:</label>
            <select name="estado">
                <option value="borrador" {% if post.estado == 'borrador' %}selected{% endif %}>Borrador</option>
                <option value="publicado" {% if post.estado == 'publicado' %}selected{% endif %}>Publicado</option>
                <option value="archivado" {% if post.estado == 'archivado' %}selected{% endif %}>Archivado</option>
            </select>
        </p>

        <button type="submit" class="btn-enviar">Guardar cambios</button>
    </form>
</div>

{% endblock %}
