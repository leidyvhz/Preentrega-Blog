{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'posts/css/estilos.css' %}">
    <title>{% block title %} Glup {% endblock %} </title>
</head>
<body>
    <header>
        <img src="{% static 'posts/img/blog.jpg' %}" alt="Imagen del blog">
        <nav>
            <a href="{% url 'inicio' %}">Inicio</a>
            <a href="{% url 'acerca' %}">About Me</a>
            <a href="{% url 'lista_posts' %}">Posts</a>
        </nav>
    </header>
    <main>
        {% block content %}
        <h1>Este es el main</h1>
        {% endblock %}
    </main>
</body>
</html>
