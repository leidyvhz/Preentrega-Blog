{% extends "posts/base.html" %}
{% block title %}Recuperar contraseña{% endblock %}
{% block content %}

<section class="auth-section">
    <div class="auth-card">
        <h2>Recuperar contraseña</h2>
        <p>Ingresa el correo asociado a tu cuenta y te enviaremos un enlace para restablecerla.</p>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-filtrar">
                Enviar enlace de recuperación
            </button>
        </form>

        <p class="auth-extra-link">
            <a href="{% url 'login' %}">← Volver al inicio de sesión</a>
        </p>
    </div>
</section>

{% endblock %}
