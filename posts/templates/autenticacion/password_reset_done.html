{% extends "posts/base.html" %}
{% block title %}Correo enviado{% endblock %}
{% block content %}

<section class="auth-section">
    <div class="auth-card">
        <h2>Revisa tu correo</h2>
        <p>
            Si existe una cuenta registrada con ese correo, te enviamos las instrucciones
            con el enlace para restablecer tu contraseña.
        </p>
        <a href="{% url 'login' %}" class="btn-auth-action">
            Volver a iniciar sesión
        </a>
    </div>
</section>

{% endblock %}
